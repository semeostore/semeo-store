<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — SEMEO STORE</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html#about">SEMEO</a><button class="search-btn" id="searchToggle">⌕</button><button class="menu-btn" id="menuToggle">☰</button></header><div class="search-panel" id="searchPanel"><input id="searchInput" placeholder="Search product name or code"><div id="searchResults"></div></div><nav class="drawer" id="drawer"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About SEMEO</a><a href="contact.html">Contact Us</a><a href="support.html">Customer Support</a></nav><main class="detail"><div><img id="mainImg" class="gallery-main"><div id="thumbs" class="thumbs"></div></div><div><h1 id="name"></h1><div id="code" class="code"></div><div id="price" class="price"></div><div id="desc"></div><div id="opts" class="options"></div><button class="buy" id="buy">BUY NOW</button></div></main><script src="app.js"></script><script>const p=P.find(x=>x.id===new URLSearchParams(location.search).get('id'))||P[0];document.title=p.name+' — SEMEO STORE';name.textContent=p.name;code.textContent='Product Code: '+p.id;price.innerHTML=p.offer?`<s>${money(p.price)}</s><b>${money(p.offer)}</b>`:money(p.price);desc.innerHTML=p.desc?`<p>${p.desc}</p>`:'';mainImg.src=root+p.id+'/1.jpeg';thumbs.innerHTML=Array.from({length:p.images},(_,i)=>`<img src="${root+p.id}/${i+1}.jpeg" onclick="mainImg.src=this.src">`).join('');opts.innerHTML=(p.colors?`<label>Colour<select id="colour">${p.colors.map(x=>`<option>${x}</option>`).join('')}</select></label>`:'')+(p.sizes?`<label>Size<select id="size">${p.sizes.map(x=>`<option>${x}</option>`).join('')}</select></label>`:'');buy.onclick=()=>location.href='order.html?id='+p.id</script></body></html>
