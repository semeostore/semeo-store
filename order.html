<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Details — SEMEO STORE</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html#about">SEMEO</a><button class="menu-btn" id="menuToggle">☰</button></header><nav class="drawer" id="drawer"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About SEMEO</a><a href="contact.html">Contact Us</a><a href="support.html">Customer Support</a></nav><main class="order"><p class="eyebrow">ORDER DETAILS</p><h1 id="product"></h1><div class="notice">Please enter accurate delivery details. Your order will be sent to SEMEO STORE on WhatsApp.</div><form id="form" class="form-grid"><label>Name<input name="name" required></label><label>Mobile Number 1<input name="mobile1" inputmode="tel" required></label><label>Mobile Number 2<input name="mobile2" inputmode="tel"></label><label>Pincode<input name="pincode" inputmode="numeric" required></label><label>District<input name="district" required></label><label>State<input name="state" value="Kerala" required></label><label class="full">Address<textarea name="address" rows="4" required></textarea></label><div id="choices" class="full"></div><button class="buy full">SEND ORDER ON WHATSAPP</button></form></main><script src="app.js"></script><script>const p=P.find(x=>x.id===new URLSearchParams(location.search).get('id'))||P[0];product.textContent=p.name+' — '+p.id;choices.innerHTML=(p.colors?`<label>Colour<select name="colour">${p.colors.map(x=>`<option>${x}</option>`).join('')}</select></label>`:'')+(p.sizes?`<label>Size<select name="size">${p.sizes.map(x=>`<option>${x}</option>`).join('')}</select></label>`:'');form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);let m=`SEMEO STORE ORDER\n\nProduct: ${p.name}\nProduct Code: ${p.id}\nPrice: ${money(p.offer||p.price)}\nName: ${f.get('name')}\nAddress: ${f.get('address')}\nDistrict: ${f.get('district')}\nState: ${f.get('state')}\nPincode: ${f.get('pincode')}\nMobile 1: ${f.get('mobile1')}\nMobile 2: ${f.get('mobile2')||'N/A'}`;if(f.get('colour'))m+=`\nColour: ${f.get('colour')}`;if(f.get('size'))m+=`\nSize: ${f.get('size')}`;location.href='https://wa.me/919074119248?text='+encodeURIComponent(m)}</script></body></html>
